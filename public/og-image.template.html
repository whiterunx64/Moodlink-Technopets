<!DOCTYPE html>
<!--
  MoodLink Open Graph image template — 1200×630.

  This is NOT served to users; it is a design source for public/og-image.png.
  To produce the PNG: open this file in a browser at exactly 1200×630 (the
  .canvas box is that size) and screenshot just the box, or run headless:

    npx playwright screenshot --viewport-size=1200,630 \
      public/og-image.template.html public/og-image.png

  Once public/og-image.png exists, app.blade.php picks it up automatically —
  no code change needed. Keep this template in the repo so the image can be
  regenerated when branding or copy changes.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0b1220; }
  .canvas {
    width: 1200px;
    height: 630px;
    background: radial-gradient(1200px 630px at 80% -10%, #16a34a 0%, #0f7a37 38%, #0b3d20 100%);
    color: #ffffff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 88px 96px;
  }
  /* Decorative soft blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.18;
    background: #ffffff;
  }
  .blob.a { width: 420px; height: 420px; right: -120px; bottom: -160px; opacity: 0.10; }
  .blob.b { width: 260px; height: 260px; right: 180px; top: -110px; opacity: 0.12; }

  .brand {
    display: flex;
    align-items: center;
    margin-bottom: 44px;
  }
  /* The logo's wordmark is dark navy, so it needs a light backing to stay
     legible on the green gradient. A white rounded card does that cleanly. */
  .logo-card {
    background: #ffffff;
    border-radius: 22px;
    padding: 18px 26px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.22);
    display: flex;
    align-items: center;
  }
  .logo-card svg { display: block; height: 72px; width: auto; }

  h1 {
    font-size: 74px;
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -1.5px;
    max-width: 920px;
  }
  h1 .accent { color: #d1fadf; }

  p.sub {
    margin-top: 30px;
    font-size: 30px;
    line-height: 1.35;
    color: rgba(255,255,255,0.92);
    max-width: 860px;
    font-weight: 500;
  }

  .foot {
    position: absolute;
    left: 96px;
    bottom: 64px;
    font-size: 24px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1fadf; }
  .url { position: absolute; right: 96px; bottom: 64px; font-size: 24px; font-weight: 700; color: #ffffff; }
</style>
</head>
